# Based on daniel-hauser/moneyman .github/workflows/scrape.yml
# One config secret, but two independent Docker/browser sessions for Cal.
name: Scrape

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123')"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
  schedule:
    - cron: "5 10,22 * * *"

env:
  REGISTRY: ghcr.io

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - id: normalize-repository-name
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: set-container-image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Pull container image
        run: docker pull "${{ steps.set-container-image.outputs.image }}"

      - name: Scrape with independent Cal sessions
        shell: bash
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: Asia/Jerusalem
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
          IMAGE: ${{ steps.set-container-image.outputs.image }}
        run: |
          set -euo pipefail
          # Never print configs: they contain bank credentials and storage tokens.
          # This implementation expects the secret to contain valid JSON.
          count=$(jq -r '[.accounts[] | select(.companyId == "visaCal")] | length' <<< "$MONEYMAN_CONFIG")
          if [[ "$count" != "2" ]]; then
            echo "Expected exactly two visaCal logins, found $count; stopping to avoid skipping accounts."
            exit 1
          fi

          # Session 1: all other providers + the first Cal login.
          config_first=$(jq -c '
            .accounts |= (
              [ .[] | select(.companyId != "visaCal") ] +
              ([ .[] | select(.companyId == "visaCal") ][0:1])
            )
          ' <<< "$MONEYMAN_CONFIG")

          # Session 2: the second Cal login only.
          config_second=$(jq -c '
            .accounts |= ([ .[] | select(.companyId == "visaCal") ][1:2])
          ' <<< "$MONEYMAN_CONFIG")

          failed=0
          echo "Starting first independent scraper container (other accounts + first Cal login)."
          if MONEYMAN_CONFIG="$config_first" docker run --rm \
            -e MONEYMAN_CONFIG -e DEBUG -e TZ -e SEND_NEW_CONFIG_TO_TG \
            "$IMAGE"; then
            echo "First container completed."
          else
            echo "First container exited with an error; second container will still run."
            failed=1
          fi

          echo "Starting second independent scraper container (second Cal login)."
          if MONEYMAN_CONFIG="$config_second" docker run --rm \
            -e MONEYMAN_CONFIG -e DEBUG -e TZ -e SEND_NEW_CONFIG_TO_TG \
            "$IMAGE"; then
            echo "Second container completed."
          else
            echo "Second container exited with an error."
            failed=1
          fi

          exit "$failed"
