# MoneyMan: supports 0, 1 or 2 Visa Cal credentials.
# With 2, the second account runs in a separate GitHub runner/browser.
# With 1, the first job runs normally and the second job is skipped.
# Other providers run once. Config is read from the existing MONEYMAN_CONFIG secret.
name: Scrape

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123')"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
  schedule:
    - cron: "5 10,22 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: household-finances-scrape
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  main-and-first-cal:
    name: Other accounts and Cal account 1 (if present)
    runs-on: ubuntu-latest
    outputs:
      has_second_cal: ${{ steps.check-cal-count.outputs.has_second_cal }}
    steps:
      - id: check-cal-count
        name: Check Cal account count
        shell: bash
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
        run: |
          set -euo pipefail
          if ! jq -e '.accounts | type == "array"' <<< "$MONEYMAN_CONFIG" >/dev/null; then
            echo "::error::MONEYMAN_CONFIG must be valid JSON with an accounts array."
            exit 1
          fi
          count=$(jq -r '[.accounts[] | select(.companyId == "visaCal")] | length' <<< "$MONEYMAN_CONFIG")
          if (( count > 2 )); then
            echo "::error::This workflow supports up to two Cal accounts. Found $count."
            exit 1
          fi
          echo "Found $count Cal account(s)."
          if (( count == 2 )); then
            echo "has_second_cal=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_second_cal=false" >> "$GITHUB_OUTPUT"
          fi

      - id: normalize-repository-name
        shell: bash
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: set-container-image
        shell: bash
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> "$GITHUB_OUTPUT"
      - name: Scrape other accounts and first Cal account
        shell: bash
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: Asia/Jerusalem
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
          IMAGE: ${{ steps.set-container-image.outputs.image }}
        run: |
          set -euo pipefail
          # Keep all non-Cal accounts plus, at most, the first Cal account.
          # With only one Cal account, this leaves that account in the run.
          filtered=$(jq -c '.accounts |= ([.[] | select(.companyId != "visaCal")] + ([.[] | select(.companyId == "visaCal")][0:1]))' <<< "$MONEYMAN_CONFIG")
          count=$(jq -r '.accounts | length' <<< "$filtered")
          if (( count == 0 )); then
            echo "No accounts to scrape in the first job."
            exit 0
          fi
          echo "Scraping $count account(s) in first isolated container."
          docker pull "$IMAGE"
          MONEYMAN_CONFIG="$filtered" docker run --rm \
            -e MONEYMAN_CONFIG -e DEBUG -e TZ -e SEND_NEW_CONFIG_TO_TG \
            "$IMAGE"

  second-cal:
    name: Cal account 2 (only when configured)
    runs-on: ubuntu-latest
    needs: main-and-first-cal
    # The second Cal account gets a fresh runner even if the first scrape fails.
    # When the config has 0 or 1 Cal accounts, skip this job completely.
    if: ${{ always() && !cancelled() && needs.main-and-first-cal.outputs.has_second_cal == 'true' }}
    steps:
      - id: normalize-repository-name
        shell: bash
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: set-container-image
        shell: bash
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> "$GITHUB_OUTPUT"
      - name: Scrape second Cal account on a fresh runner
        shell: bash
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: Asia/Jerusalem
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
          IMAGE: ${{ steps.set-container-image.outputs.image }}
        run: |
          set -euo pipefail
          filtered=$(jq -c '.accounts |= ([.[] | select(.companyId == "visaCal")][1:2])' <<< "$MONEYMAN_CONFIG")
          count=$(jq -r '.accounts | length' <<< "$filtered")
          if (( count != 1 )); then
            echo "::error::Expected one second Cal account; found $count. Check MONEYMAN_CONFIG."
            exit 1
          fi
          echo "Scraping second Cal account in fresh runner."
          docker pull "$IMAGE"
          MONEYMAN_CONFIG="$filtered" docker run --rm \
            -e MONEYMAN_CONFIG -e DEBUG -e TZ -e SEND_NEW_CONFIG_TO_TG \
            "$IMAGE"
